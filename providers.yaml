default_provider: mistral_agent
providers:
  claude_code:
    type: claude_code
    label: Claude Code
  lmstudio_qwen:
    type: openai_compatible
    label: Qwen 3.5 advisory (LM Studio)
    base_url: http://127.0.0.1:1234/v1
    model: qwen/qwen3.5-35b-a3b
    api_key_env: TANK_LMSTUDIO_API_KEY
    api_key_default: lm-studio
    include_repo_context: true
    max_context_files: 16
    max_context_files_analysis: 24
  local_qwen:
    type: local_agent
    label: Qwen local agent (Tank-controlled)
    base_url: http://127.0.0.1:1234/v1
    model: qwen/qwen3.5-35b-a3b
    api_key_env: TANK_LMSTUDIO_API_KEY
    api_key_default: lm-studio
    max_context_files: 16
    max_context_files_analysis: 24
    max_file_bytes: 32000
  openrouter:
    type: openai_compatible
    label: OpenRouter advisory (pay-per-token)
    base_url: https://openrouter.ai/api/v1
    model: qwen/qwen-2.5-72b-instruct
    api_key_env: OPENROUTER_API_KEY
    include_repo_context: true
    max_context_files: 16
    max_context_files_analysis: 24
  openrouter_agent:
    type: local_agent
    label: OpenRouter agent (Tank-controlled)
    base_url: https://openrouter.ai/api/v1
    model: openai/gpt-4o
    api_key_env: OPENROUTER_API_KEY
    json_mode: true
    temperature: 0.15
    max_context_files: 16
    max_context_files_analysis: 24
    max_file_bytes: 32000
  mistral:
    type: openai_compatible
    label: Mistral advisory
    base_url: https://api.mistral.ai/v1
    model: mistral-small-latest
    api_key_env: MISTRAL_API_KEY
    include_repo_context: true
    max_context_files: 16
    max_context_files_analysis: 24
    temperature: 0.15
  mistral_agent:
    type: local_agent
    label: Mistral agent (Tank-controlled)
    base_url: https://api.mistral.ai/v1
    model: codestral-latest
    api_key_env: MISTRAL_API_KEY
    json_mode: true
    temperature: 0.15
    max_context_files: 16
    max_context_files_analysis: 24
    max_file_bytes: 32000
  crew_senior_systems_reviewer:
    type: crew
    label: Senior Systems Reviewer
    process: sequential
    agents:
    - provider: openrouter_agent
      role_slug: senior_systems_reviewer_step_1
  crew_powershell_expert:
    type: crew
    label: Powershell_expert
    process: sequential
    agents:
    - provider: openrouter_agent
      role_slug: powershell_expert_step_1
      task_suffix: 'Focus exclusively on the script directory: D:\Projects\Work\CityAdminConsole\CityAdminConsole\PowerShell-main\scripts.   When
        analyzing a front-end function with a missing backend link: 1. Search the
        target directory for any existing `.ps1` files with matching keywords, parameters,
        or logical intent. 2. If an exact or highly adaptable script is found, document
        the mapping clearly. 3. If no script exists, generate a new, production-ready
        PowerShell script, save it to the directory with a clear naming convention,
        and provide the file path. Ensure any generated scripts include Try-Catch
        blocks for resilience.'
  crew_legacy_hybrid_integrator:
    type: crew
    label: Legacy_Hybrid_Integrator
    process: sequential
    agents:
    - provider: openrouter_agent
      role_slug: legacy_hybrid_integrator_step_1
      task_suffix: 'Focus exclusively on the script directory: D:\Projects\Work\CityAdminConsole\CityAdminConsole\PowerShell-main\scripts.   When
        analyzing a front-end function with a missing backend link: 1. Search the
        target directory for any existing `.ps1` files with matching keywords, parameters,
        or logical intent. 2. If an exact or highly adaptable script is found, document
        the mapping clearly. 3. If no script exists, generate a new, production-ready
        PowerShell script, save it to the directory with a clear naming convention,
        and provide the file path. Ensure any generated scripts include Try-Catch
        blocks for resilience. C RITICAL: The script directory contains subfolders.
        You must perform a recursive search.   If your file search tools do not natively
        support recursion: 1. Use ''list_directory'' on the root scripts folder to
        map out all subdirectories. 2. Systematically inspect each subfolder using
        ''list_directory'' or ''file_search'' to ensure no existing scripts are missed.
        3. Do not assume a script does not exist until you have audited all nested
        folders.  HYBRID ENVIRONMENT AUDIT & CREATION CAPABILITY: You must proactively
        look for missing common administrative functions essential for a hybrid IT
        environment (On-Premises AD integrated with Azure AD/M365, Exchange Hybrid,
        and local file/print infrastructure).  If the front-end UI or the current
        script inventory (''output1.csv'') lacks any of the following standard workflows,
        you are authorized to proactively architect and output a new standalone production
        script for it: - Entra ID Connect Delta Sync Force: (e.g., ''Invoke-EntraIDConnectSync.ps1''
        checking for local ADSync module installation). - Hybrid Mailbox Management:
        Validation of remote routing addresses (''@tenant.mail.onmicrosoft.com'')
        and remote mailbox creation wrappers. - Local Print Spooler / Driver Remediation:
        Automating print spooler clearing or local driver staging matching options
        found under ''Declare-PrintDrivers.ps1''. - Local Active Directory / M365
        Account Lifecycle Syncing: Ensuring hard-match immutableID updates or group
        membership auditing between local OUs and cloud groups.  When generating a
        script for a missing hybrid capability, ensure it conforms to the lazy-loading
        pattern of ''CityAdmin.Core.psm1'' and includes explicit checks for necessary
        local modules (like ActiveDirectory, ExchangeOnlineManagement, or Az/Microsoft.Graph).'
  crew_cityconsoleauditorcrew:
    type: crew
    label: CityConsoleAuditorCrew
    process: sequential
    agents:
    - provider: openrouter_agent
      role_slug: cityconsoleauditorcrew_step_1
      task_suffix: 'Focus only on: D:\Projects\Work\CityAdminConsole\CityAdminConsole\PowerShell-main\scripts  Use
        list_directory recursively. Read likely matching scripts. Do not create files.  Return:
        1. Existing script inventory by category 2. Existing matches for:    - Entra
        ID Connect Delta Sync Force    - Hybrid Mailbox Management    - Print Spooler
        / Driver Remediation    - Local AD / M365 Account Lifecycle Syncing 3. Missing
        capabilities 4. Recommended target filenames and folders for missing scripts'
    - provider: openrouter_agent
      role_slug: cityconsoleauditorcrew_step_2
      task_suffix: 'Use the prior agent’s inventory as your source of truth.  For
        each confirmed missing capability, create a new standalone .ps1 script in
        the most appropriate scripts subfolder.  Required missing-capability targets:
        - Entra ID Connect Delta Sync Force - Hybrid Mailbox Management - Local Print
        Spooler / Driver Remediation - Local AD / M365 Account Lifecycle Syncing  Rules:
        - Do not only produce a plan. - Write actual files using write_to_file. -
        Include Try/Catch blocks. - Check required modules before use. - Follow the
        lazy-loading pattern of CityAdmin.Core.psm1 when applicable. - Do not overwrite
        existing scripts unless explicitly necessary. - Final output must list every
        created file path and its purpose.'
    - provider: openrouter_agent
      role_slug: cityconsoleauditorcrew_step_3
      task_suffix: 'Review the prior agents’ inventory and newly created scripts.  Then
        inspect the CityAdminConsole project enough to identify the menu or mapping
        files that connect UI/menu actions to backend scripts.  Tasks: 1. Find the
        menu/config/framework files that reference scripts. 2. Map new scripts into
        the correct menu or framework location if the structure is obvious. 3. If
        automatic integration is unsafe, produce a precise integration report with
        exact file paths and recommended edits. 4. Do not overwrite unrelated files.
        5. Final output must include:    - Scripts mapped    - Files changed    -
        Remaining unmapped functions    - Manual follow-up needed, if any'
