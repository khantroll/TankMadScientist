default_provider: local_qwen
providers:
  claude_code:
    type: claude_code
    label: Claude Code
  lmstudio_qwen:
    type: openai_compatible
    label: Qwen 3.5 advisory (LM Studio)
    base_url: http://127.0.0.1:1234/v1
    model: qwen/qwen3.5-35b-a3b
    api_key_env: TANK_LMSTUDIO_API_KEY
    api_key_default: lm-studio
    include_repo_context: true
    max_context_files: 16
    max_context_files_analysis: 24
  local_qwen:
    type: local_agent
    label: Qwen local agent (Tank-controlled)
    base_url: http://127.0.0.1:1234/v1
    model: qwen/qwen3.5-35b-a3b
    api_key_env: TANK_LMSTUDIO_API_KEY
    api_key_default: lm-studio
    max_context_files: 16
    max_context_files_analysis: 24
    max_file_bytes: 32000
  openrouter:
    type: openai_compatible
    label: OpenRouter advisory (pay-per-token)
    base_url: https://openrouter.ai/api/v1
    model: qwen/qwen-2.5-72b-instruct
    api_key_env: OPENROUTER_API_KEY
    include_repo_context: true
    max_context_files: 16
    max_context_files_analysis: 24
  openrouter_agent:
    type: local_agent
    label: OpenRouter agent (Tank-controlled)
    base_url: https://openrouter.ai/api/v1
    model: openai/gpt-4o
    api_key_env: OPENROUTER_API_KEY
    json_mode: true
    temperature: 0.15
    max_context_files: 16
    max_context_files_analysis: 24
    max_file_bytes: 32000
  mistral:
    type: openai_compatible
    label: Mistral advisory
    base_url: https://api.mistral.ai/v1
    model: mistral-small-latest
    api_key_env: MISTRAL_API_KEY
    include_repo_context: true
    max_context_files: 16
    max_context_files_analysis: 24
    temperature: 0.15
  mistral_agent:
    type: local_agent
    label: Mistral agent (Tank-controlled)
    base_url: https://api.mistral.ai/v1
    model: codestral-latest
    api_key_env: MISTRAL_API_KEY
    json_mode: true
    temperature: 0.15
    max_context_files: 16
    max_context_files_analysis: 24
    max_file_bytes: 32000
