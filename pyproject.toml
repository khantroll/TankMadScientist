[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tank"
version = "0.1.0"
description = "Self-hosted command center for running Claude Code agents in parallel"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask==3.0.3",
    "APScheduler==3.10.4",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
production = ["gunicorn>=22.0"]

[project.scripts]
tank = "app:main"

[tool.setuptools]
py-modules = [
    "app",
    "config",
    "git_sync",
    "local_agent",
    "log_format",
    "mad_scientist",
    "mad_scientist_graph",
    "mission",
    "models",
    "orchestrator",
    "output_quality",
    "prompt_library",
    "providers",
    "repo_context",
    "run_chain",
    "scheduler",
    "session_manager",
    "tank_cli",
]
include-package-data = true

[tool.setuptools.data-files]
"share/tank" = [
    "workspaces.yaml",
    "providers.yaml",
    "mission_templates.yaml",
    "README.md",
]
"share/tank/templates" = [
    "templates/base.html",
    "templates/dashboard.html",
    "templates/schedules.html",
    "templates/workspace.html",
]
"share/tank/templates/partials" = [
    "templates/partials/crew_step_row.html",
    "templates/partials/git_result.html",
    "templates/partials/mission_list.html",
    "templates/partials/run_children.html",
    "templates/partials/run_list.html",
    "templates/partials/run_output.html",
    "templates/partials/workspace_cards.html",
]
"share/tank/static/css" = ["static/css/style.css"]
"share/tank/static/js" = ["static/js/htmx.min.js", "static/js/tank.js"]
"share/tank/scripts" = ["scripts/validate_mad_scientist_graph.py"]
